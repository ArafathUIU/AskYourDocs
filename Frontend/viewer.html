<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AskYourDocs — Document Viewer</title>
  <meta name="description" content="Direct document viewer for citations and page excerpts in AskYourDocs." />
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module"></script>
  <style>
    .viewer-layout {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 64px);
      background: var(--bg-base);
    }

    .viewer-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--border-default);
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      z-index: 10;
    }

    .viewer-toolbar .page-input {
      width: 54px;
      padding: 6px 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      color: var(--text-primary);
      border-radius: var(--radius-xs);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      text-align: center;
      font-weight: 600;
      outline: none;
    }

    .viewer-toolbar .page-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .viewer-toolbar span {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-family: var(--font-mono);
    }

    .viewer-zoom-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 12px;
      border-left: 1px solid var(--border-default);
      padding-left: 12px;
    }

    .viewer-canvas-wrap {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      padding: 30px;
      background: var(--bg-base);
    }

    .viewer-canvas-wrap canvas {
      box-shadow: var(--shadow-lg);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-default);
      background: #ffffff;
    }

    .viewer-loading, .viewer-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
      font-size: 0.95rem;
      gap: 12px;
    }

    .viewer-error {
      color: var(--red);
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a href="/" class="logo">
      <div class="logo-icon">✦</div>
      AskYourDocs <span>/ viewer</span>
    </a>
    <nav class="nav-links">
      <a href="/" class="nav-btn">Documents</a>
      <a href="/chat-page" class="nav-btn primary">Chat</a>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">◐</button>
    </nav>
  </div>
</header>

<div class="viewer-layout">
  <div class="viewer-toolbar">
    <button class="btn" onclick="prevPage()">← Previous</button>
    <input type="number" class="page-input" id="pageInput" min="1" value="1" onchange="goToPage()" />
    <span>/</span>
    <span id="totalPages">1</span>
    <button class="btn" onclick="nextPage()">Next →</button>

    <div class="viewer-zoom-controls">
      <button class="btn" onclick="zoomOut()" title="Zoom out">−</button>
      <span id="zoomLevel" style="min-width: 46px; text-align: center;">100%</span>
      <button class="btn" onclick="zoomIn()" title="Zoom in">+</button>
    </div>

    <span style="margin-left: auto; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);" id="docTitle">Loading document...</span>
  </div>

  <div class="viewer-canvas-wrap" id="viewerContainer">
    <div class="viewer-loading" id="loadingMsg">
      <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
      <span>Rendering document page...</span>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

  (function() {
    const saved = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
  })();

  window.toggleTheme = function() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  };

  const params = new URLSearchParams(window.location.search);
  const docId = params.get('doc');
  let targetPage = parseInt(params.get('page')) || 1;

  let pdfDoc = null;
  let currentPage = targetPage;
  let currentScale = 1.3;
  let isRendering = false;

  async function loadPDF() {
    if (!docId) {
      showError('No document ID specified in query parameters.');
      return;
    }

    try {
      // Get document metadata
      const docRes = await fetch(`/api/documents/${docId}/status`);
      if (docRes.ok) {
        const docInfo = await docRes.json();
        document.getElementById('docTitle').textContent = `Doc #${docId}`;
      }
    } catch {}

    const url = `/api/documents/${docId}/download`;

    try {
      const loadingTask = pdfjsLib.getDocument(url);
      pdfDoc = await loadingTask.promise;
      document.getElementById('totalPages').textContent = pdfDoc.numPages;

      if (currentPage > pdfDoc.numPages) currentPage = 1;
      document.getElementById('pageInput').value = currentPage;
      document.getElementById('pageInput').max = pdfDoc.numPages;

      renderPage(currentPage);
    } catch (err) {
      showError(`Unable to render preview for this file type or PDF. You can download the extracted text directly.`);
    }
  }

  async function renderPage(num) {
    if (!pdfDoc || isRendering) return;
    isRendering = true;

    const container = document.getElementById('viewerContainer');
    container.innerHTML = '';

    try {
      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: currentScale });

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      container.appendChild(canvas);

      const renderContext = { canvasContext: ctx, viewport: viewport };
      await page.render(renderContext).promise;

      document.getElementById('pageInput').value = num;
      document.getElementById('zoomLevel').textContent = `${Math.round((currentScale / 1.3) * 100)}%`;
    } catch (err) {
      showError('Failed to render page.');
    } finally {
      isRendering = false;
    }
  }

  window.prevPage = function() {
    if (currentPage <= 1) return;
    currentPage--;
    renderPage(currentPage);
  };

  window.nextPage = function() {
    if (!pdfDoc || currentPage >= pdfDoc.numPages) return;
    currentPage++;
    renderPage(currentPage);
  };

  window.goToPage = function() {
    const input = document.getElementById('pageInput');
    let val = parseInt(input.value);
    if (isNaN(val) || val < 1) val = 1;
    if (pdfDoc && val > pdfDoc.numPages) val = pdfDoc.numPages;
    currentPage = val;
    renderPage(currentPage);
  };

  window.zoomIn = function() {
    currentScale = Math.min(currentScale + 0.25, 3.0);
    renderPage(currentPage);
  };

  window.zoomOut = function() {
    currentScale = Math.max(currentScale - 0.25, 0.75);
    renderPage(currentPage);
  };

  function showError(msg) {
    const container = document.getElementById('viewerContainer');
    container.innerHTML = `
      <div class="viewer-error">
        <div style="font-size: 2.2rem; margin-bottom: 8px;">📄</div>
        <div>${msg}</div>
        <a href="/" class="btn" style="margin-top: 12px;">← Back to Documents</a>
      </div>
    `;
    document.getElementById('docTitle').textContent = 'Document Error';
  }

  loadPDF();
</script>
</body>
</html>
